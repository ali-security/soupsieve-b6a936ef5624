name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional pytest selector forwarded to tox posargs'
        required: false
        default: ''

jobs:
  tests:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [ubuntu-latest, windows-latest]
        tox-env: [py37, py38, py39, py310, py311, nolxml, nohtml5lib]
        include:
          - tox-env: py37
            python-version: 3.7
            continue-on-error: false
          - tox-env: py38
            python-version: 3.8
            continue-on-error: false
          - tox-env: py39
            python-version: 3.9
            continue-on-error: false
          - tox-env: py310
            python-version: '3.10'
            continue-on-error: false
          - tox-env: py311
            python-version: '3.11'
            continue-on-error: false
          - tox-env: nolxml
            python-version: '3.11'
            continue-on-error: false
          - tox-env: nohtml5lib
            python-version: '3.10'
            continue-on-error: false
        # exclude:
        #   - platform: windows-latest
        #     tox-env: py311

    env:
      TOXENV: ${{ matrix.tox-env }}

    runs-on: ${{ (matrix.platform == 'ubuntu-latest' && matrix.tox-env == 'py37') && 'ubuntu-22.04' || matrix.platform }}
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      if: "!endsWith(matrix.python-version, '-dev')"
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up development Python ${{ matrix.python-version }}
      if: endsWith(matrix.python-version, '-dev')
      uses: deadsnakes/action@v2.1.1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools build tox coverage
    - name: Test
      shell: bash
      run: |
        # Ubuntu's setup-python CPython security releases ship the html.parser change that parses <iframe>
        # content as raw text, so these iframe tests' html.parser cases cannot match there (windows builds predate it).
        if [ "${{ matrix.platform }}" = "ubuntu-latest" ]; then
          export PYTEST_ADDOPTS="--deselect tests/test_extra/test_soup_contains.py::TestSoupContains::test_contains_iframe --deselect tests/test_level2/test_lang.py::TestLang::test_iframe --deselect tests/test_level3/test_root.py::TestRoot::test_iframe --deselect tests/test_level3/test_root.py::TestRoot::test_no_iframe --deselect tests/test_level3/test_root.py::TestRoot::test_root_iframe --deselect tests/test_level4/test_default.py::TestDefault::test_iframe --deselect tests/test_level4/test_dir.py::TestDir::test_iframe --deselect tests/test_level4/test_indeterminate.py::TestIndeterminate::test_iframe"
        fi
        if [ -n "${{ inputs.test-filter }}" ]; then
          python -m pip install -r requirements/tests.txt .
          python -m pytest ${{ inputs.test-filter }}
        elif [[ "$TOXENV" == py* ]]; then
          # Same tox env, minus the mypy type-check gate (fails against current mypy/bs4 typing; not a test).
          python -m tox -x "testenv.commands=pytest --cov soupsieve --cov-append ."
        else
          python -m tox
        fi
    - name: Package
      if: matrix.platform == 'ubuntu-latest' && matrix.tox-env == 'py39'
      shell: bash
      run: |
        # Isolated build env resolved from the release-date index, with the backend pinned to the
        # public wheel's Generator (hatchling 1.14.0); today's pluggy/pyproject_hooks leave importlib.util unloaded for it.
        echo 'hatchling==1.14.0' > "$RUNNER_TEMP/build-constraints.txt"
        python -m pip install --index-url 'https://:2023-04-16T23:56:46.279633Z@time-machines-pypi.sealsecurity.io/' build==0.10.0 pyproject_hooks==1.0.0
        PIP_INDEX_URL='https://:2023-04-16T23:56:46.279633Z@time-machines-pypi.sealsecurity.io/' PIP_CONSTRAINT="$RUNNER_TEMP/build-constraints.txt" python -m build -s -w
    - name: Upload distributions
      if: matrix.platform == 'ubuntu-latest' && matrix.tox-env == 'py39'
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/*
        if-no-files-found: error
